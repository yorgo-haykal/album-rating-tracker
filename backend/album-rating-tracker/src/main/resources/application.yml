spring:
  main:
    lazy-initialization: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/album_tracker}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:devpass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:this-is-a-temporary-local-dev-secret-change-it-before-deploying-anywhere-real}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}