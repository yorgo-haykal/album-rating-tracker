spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/album_tracker
    username: postgres
    password: devpass
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:this-is-a-temporary-local-dev-secret-change-it-before-deploying-anywhere-real}
  expiration-ms: 86400000  # 24 hours