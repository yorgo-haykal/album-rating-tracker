services:
  db:
    image: postgres:16
    container_name: album-tracker-db
    environment:
      POSTGRES_DB: album_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/album-rating-tracker
    container_name: album-tracker-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/album_tracker
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: devpass
      JWT_SECRET: local-docker-compose-dev-secret-not-for-production
      CORS_ALLOWED_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  postgres_data: